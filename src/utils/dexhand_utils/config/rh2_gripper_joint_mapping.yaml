# RH2 Gripper-to-Joint Mapping (multi-profile)
#
# joint_positions order: [thumb_yaw, thumb_pitch, index, middle, ring, pinky] (radians).
# This matches the joint order of the ruiyan_rh2_hand_joint_position_controller:
#   [thumb_proximal_yaw_joint, thumb_proximal_pitch_joint,
#    index_proximal_joint, middle_proximal_joint, ring_proximal_joint, pinky_proximal_joint]
#
# Profiles (max_gripper_width per profile is taken from the last/widest mapping entry):
#   full_hand     -> 5-finger power grasp; all five fingers participate       (max_width 0.080m)
#   three_fingers -> 3-finger tripod grasp (thumb + index + middle)           (max_width 0.080m)
#   pinch         -> 2-finger parallel/pinch grasp (thumb + index)            (max_width 0.050m)
#
# default_profile is the profile used until one is selected at runtime.
# Switch profiles at runtime by publishing the profile name on the `set_grasp_profile` topic.

default_profile: full_hand
profiles:
  full_hand:
    description: "Full hand power grasp for large objects"
    mapping:
      - {gripper_width: 0.000, joint_positions: [0.000, 0.50, 1.43, 1.43, 1.43, 1.43]} # fully closed
      - {gripper_width: 0.001, joint_positions: [1.75, 0.20, 0.68, 0.70, 0.75, 0.54]} # 0.1cm
      - {gripper_width: 0.010, joint_positions: [1.75, 0.25, 0.63, 0.65, 0.70, 0.52]} # 1cm
      - {gripper_width: 0.020, joint_positions: [1.75, 0.20, 0.78, 0.60, 0.65, 0.50]} # 2cm
      - {gripper_width: 0.030, joint_positions: [1.75, 0.15, 0.53, 0.55, 0.60, 0.48]} # 3cm
      - {gripper_width: 0.040, joint_positions: [1.75, 0.10, 0.48, 0.50, 0.55, 0.46]} # 4cm
      - {gripper_width: 0.050, joint_positions: [1.75, 0.08, 0.43, 0.45, 0.50, 0.44]} # 5cm
      - {gripper_width: 0.060, joint_positions: [1.75, 0.06, 0.38, 0.40, 0.45, 0.42]} # 6cm
      - {gripper_width: 0.070, joint_positions: [1.75, 0.04, 0.33, 0.35, 0.40, 0.40]} # 7cm
      - {gripper_width: 0.080, joint_positions: [1.75, 0.02, 0.28, 0.30, 0.35, 0.38]} # 8cm

  pinch:
    description: "Pinch grasp using thumb + index"
    mapping:
      - {gripper_width: 0.000, joint_positions: [1.57, 0.50, 1.47, 1.47, 1.47, 1.47]}
      - {gripper_width: 0.020, joint_positions: [1.57, 0.20, 0.70, 1.47, 1.47, 1.47]}
      - {gripper_width: 0.050, joint_positions: [1.57, 0.05, 0.40, 1.47, 1.47, 1.47]}

  three_fingers:
    description: "Tripod grasp using thumb + index + middle"
    mapping:
      - {gripper_width: 0.000, joint_positions: [0.000, 0.50, 1.47, 1.47, 1.47, 1.47]} # fully closed
      - {gripper_width: 0.001, joint_positions: [1.60, 0.25, 0.80, 0.86, 1.47, 1.44]} # 0.1cm
      - {gripper_width: 0.010, joint_positions: [1.60, 0.23, 0.78, 0.82, 1.47, 1.44]} # 1cm
      - {gripper_width: 0.020, joint_positions: [1.60, 0.18, 0.72, 0.73, 1.47, 1.44]} # 2cm
      - {gripper_width: 0.030, joint_positions: [1.60, 0.14, 0.65, 0.69, 1.47, 1.44]} # 3cm
      - {gripper_width: 0.040, joint_positions: [1.60, 0.13, 0.60, 0.63, 1.47, 1.44]} # 4cm
      - {gripper_width: 0.050, joint_positions: [1.60, 0.12, 0.58, 0.60, 1.47, 1.44]} # 5cm
      - {gripper_width: 0.060, joint_positions: [1.60, 0.11, 0.55, 0.57, 1.47, 1.44]} # 6cm
      - {gripper_width: 0.070, joint_positions: [1.60, 0.08, 0.45, 0.47, 1.47, 1.44]} # 7cm
      - {gripper_width: 0.080, joint_positions: [1.60, 0.04, 0.40, 0.42, 1.47, 1.44]} # 8cm